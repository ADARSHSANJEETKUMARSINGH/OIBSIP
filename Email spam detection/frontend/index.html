<!DOCTYPE html>
<html>
<head>
    <title>Spam Detector</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
            background-color: #f5f5f5;
        }

        textarea {
            width: 400px;
            height: 120px;
            padding: 10px;
            font-size: 14px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background-color: #0056b3;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<h2>Email Spam Detection</h2>

<textarea id="text" placeholder="Enter your message here..."></textarea><br><br>

<button onclick="predict()">Check</button>

<div id="result"></div>

<script>
async function predict() {
    let text = document.getElementById("text").value;

    let response = await fetch("http://127.0.0.1:8000/predict", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ text: text })
    });

    let data = await response.json();

    document.getElementById("result").innerText = 
        "Result: " + data.prediction;
}
</script>

</body>
</html>
